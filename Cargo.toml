[package]
name = "ftextarea"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A simple full-screen textarea web app with localStorage persistence"
repository = "https://github.com/vincevargadev/ftextarea"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.100"

[dependencies.web-sys]
version = "0.3.77"
features = [
    "Window",
    "Document",
    "Element",
    "EventTarget",
    "HtmlTextAreaElement",
    "HtmlElement",
    "HtmlDialogElement",
    "Storage",
    "StorageEvent",
    "Event",
    "InputEvent",
    "VisibilityState",
    "console",
]
